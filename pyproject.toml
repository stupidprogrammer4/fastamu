[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastamu"
version = "0.7.1"
description = "A convention-driven, modular-monolith framework for Python backends"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Pouya", email = "captainjoker757@gmail.com" }
]
keywords = [
    "fastapi",
    "framework",
    "modular-monolith",
    "dishka",
    "taskiq",
    "sqlmodel",
    "cqrs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.136.0,<0.137.0",
    "fastapi-cli>=0.0.24,<0.1.0",
    "fastapi-cloud-cli>=0.17.0,<0.18.0",
    "taskiq-fastapi>=0.5.0,<0.6.0",
    "alembic>=1.18.4,<2.0.0",
    "SQLAlchemy>=2.0.49,<3.0.0",
    "sqlmodel>=0.0.38,<0.1.0",
    "thefuzz>=0.22.1,<0.23.0",
    "colorlog>=6.10.1,<7.0.0",
    "orjson>=3.11.5,<4.0.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
    "gunicorn>=23.0.0,<24.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "PyYAML>=6.0.3,<7.0.0",
    "typer>=0.20.0,<0.21.0",
    "yoyo-migrations>=9.0.0,<10.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "redis>=7.1.0,<8.0.0",
    "throttled-py[redis]>=3.4.1,<4.0.0",
    "APScheduler>=3.11.1,<4.0.0",
    "pandas>=2.3.3,<3.0.0",
    "numpy>=2.3.5,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "xlsxwriter>=3.2.9,<4.0.0",
    "requests>=2.32.5,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "sentry-sdk>=2.46.0,<3.0.0",
    "jalali_core>=1.0.0,<2.0.0",
    "jdatetime>=5.2.0,<6.0.0",
    "persiantools>=5.4.0,<6.0.0",
    "pytz>=2025.2,<2026.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    "PyJWT>=2.10.1,<3.0.0",
    "cryptography>=46.0.3,<47.0.0",
    "rich>=14.2.0,<15.0.0",
    "taskiq>=0.12.1,<0.13.0",
    "taskiq-dependencies>=1.5.7,<2.0.0",
    "aiofiles>=25.1.0,<26.0.0",
    "dishka>=1.8.0,<2.0.0",
    "elasticsearch[async]>=8.19.3,<9.0.0",
    "swagger-ui-bundle>=1.1.0,<2.0.0",
    "fastapi-csrf-protect>=1.0.7,<2.0.0",
]

[project.optional-dependencies]
mssql = ["aioodbc>=0.5,<1.0"]
oracle = ["oracledb>=2,<5"]
mysql = ["asyncmy>=0.2.10,<0.3.0"]
sqlite = ["aiosqlite>=0.20,<1.0"]
events = [
    "faststream[rabbit,redis]>=0.7.5,<0.8.0",
    "dishka-faststream>=0.7.0,<0.8.0",
]
cqrs = ["taskiq-aio-pika>=0.6.0,<0.7.0"]
scheduler = ["taskiq-redis>=1.2.1,<2.0.0"]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "anyio==4.13.0",
    "playwright==1.56.0",
    "watchfiles==1.1.1",
    "ruff",
    "pyright==1.1.390",
]

[project.scripts]
fastamu = "fastamu.manager:app"

# the test harness ships with the package: any project that depends on
# Fastamu gets pg / uow / clean_db / dishka_container / anonymous with no
# conftest to copy
[project.entry-points.pytest11]
fastamu = "fastamu.testing.fixtures"

[project.urls]
Homepage = "https://github.com/stupidprogrammer4/fastamu"
Repository = "https://github.com/stupidprogrammer4/fastamu"

[tool.hatch.build.targets.wheel]
packages = ["fastamu"]

[tool.hatch.build.targets.sdist]
# the docs and the suite belong in the source distribution; the reference
# modules are already inside the package
include = ["fastamu", "tests", "README.md", "LICENSE", "pytest.ini"]

# pytest configuration lives in pytest.ini (single source of truth — pytest.ini
# takes precedence over pyproject, so do not re-add [tool.pytest.ini_options]).

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["fastamu"]

[tool.pyright]
include = ["fastamu"]
pythonVersion = "3.13"
# "basic" is pragmatic for an existing codebase; tighten to "strict" per
# package as it's hardened. The rules below are the type-safety floor.
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportImplicitOverride = "none"

[tool.fastapi]
entrypoint = "fastamu.web.app:app"
